# ==========================================================================
#  ITS2 alignment run console -- single configuration file
# ==========================================================================
#  Every setting a training run needs lives here. Edit by hand, with
#  `config/runctl.sh set KEY=VALUE`, or through the ROOT GUI
#  (`config/runctl.sh ui`).
#
#  This file is sourced by bash, so the syntax is KEY="value" with no
#  spaces around the equals sign. Anything else here is a comment.
#
#  The console never writes into the module checkout. `runctl.sh compose`
#  builds a self-contained job directory under OUTPUT_DIR and patches the
#  knobs into that job's own copies of the headers and sources, so a tree
#  that is meant to stay untouched stays untouched.
# ==========================================================================


# --------------------------------------------------------------- inputs ---

# Reconstructed track file the job trains on. Linked into the job directory
# as XXXXinput.root rather than copied -- it is ~800 MB.
DATA_FILE=""

# Tree inside DATA_FILE. Patched into the job's run_train_circle.C.
DATA_TREE="DataInput"

# Detector geometry and the starting alignment. Both are linked, not copied.
GEOM_FILE="o2sim_geometry.root"
ALIGN_FILE="ITSAlignment.root"

# Seed network parameters: a MLPTrain_Step<N>.tgz, or a directory holding
# weights/ and UpdateSensorsList.txt. Unpacked into MLPTrain_Step<FIRST_STEP-1>.
PARAMS_ARCHIVE=""


# --------------------------------------------------------------- module ---

# The alignment checkout to run. Empty means this repository. Point it at
# another tree -- a 2025 checkout, say -- and the console reads that tree's
# own headers instead of assuming this one's.
MODULE_DIR=""

# First step this run produces. Must be at least 1: at step 0 the module
# hands LoadUpdateSensorList an empty name and errors out.
FIRST_STEP="901"

# How many steps to train, back to back. Step N reads MLPTrain_Step<N-1>/
# and writes MLPTrain_Step<N>/, so the chain continues on its own.
N_STEPS="1"


# ------------------------------------------------------------ job: size ---
# Written into the job's own YMLPParallel.h.

JOB_NDATA="4000"           # nDATA     -- events read from DATA_FILE
JOB_NEPOCH="5"             # nEPOCH    -- 0 evaluates only; above 0 trains
JOB_NCORE="1"              # nCORE
JOB_JPARALLEL="0"          # jparallel


# ----------------------------------------------------------- job: model ---
# Patched into the job's Ymlp/inc/DetectorConstant.h and run_train_circle.C.

JOB_NTRACKMAX="8"          # nTrackMax -- prongs per event; ndf = 12n+1
JOB_DET_MAG="-0.5"         # DET_MAG   -- signed field in T; the sign reaches
                           #              the impact parameter
JOB_FITMODEL="2"
JOB_VERTEXFIT="kFALSE"
JOB_LEARNING_METHOD="kStochastic"
                           # kStochastic kBatch kBatchDetectorUnitUser
                           # kSteepestDescent kRibierePolak kFletcherReeves
                           # kBFGS kOffsetTuneByMean


# -------------------------------------------------------- job: learning ---
# Patched into the job's Ymlp/src/YMultiLayerPerceptron.cxx, which defines
# these as plain globals rather than macros.
#
#   eta = JOB_ETA_CONSTANT * JOB_ETA_SCALE * (JOB_ETA_DETRES * 1e-4)^2
#
# This is the STARTING learning rate. The module backtracks on its own: if
# the cost rises it reloads the previous epoch and divides eta by sqrt(10),
# up to four times.

JOB_ETA_CONSTANT="0.05"
JOB_ETA_SCALE="1.0e-7"
JOB_ETA_DETRES="1000.0"    # DETRES, um -- assumed detector resolution

# Clamps how much one hit's residual may contribute to the weight update.
JOB_VALID_WINDOW="0.25"


# ------------------------------------------------------- job: selection ---
# Which tracks and hits reach the cost and the update. Patched into the
# job's Ymlp/inc/DetectorConstant.h.

JOB_PT_MIN="0.40"          # Update_pTmin
JOB_PT_MAX="2.00"          # Update_pTmax

# Bad-hit thresholds. The first pair governs the COST, the second pair the
# WEIGHT UPDATE; they are deliberately different.
JOB_CHI_IB="100.0"         # RANGE_CHI_IB
JOB_CHI_OB="100.0"         # RANGE_CHI_OB
JOB_CHI_IB_TRAIN="5.0"
JOB_CHI_OB_TRAIN="9.0"     # RANGE_CHI_OB_TRAINING

# Track-level cost cut, applied in both paths.
JOB_TRACK_REJECT="110.0"   # TrackRejection

# Impact-parameter acceptance. In this legacy tree these two decide how much
# the layer-0 defect costs: a track whose reference point was never written
# lands far outside and is dropped from both the cost and the update.
JOB_IP_RANGE_R="0.2"
JOB_IP_RANGE_Z="0.5"       # RANGE_IMPACTPARAMS_Z, cm

# Clusters a sensor needs before its network is updated. 0 gates nothing.
JOB_MIN_CLUSTER="0"


# --------------------------------------------------------------- output ---

# Where job directories are created. One directory per JOB_TAG.
OUTPUT_DIR="runs"

# Name of this job's directory under OUTPUT_DIR.
JOB_TAG="job001"


# ---------------------------------------------------------- environment ---

# ROOT installation to run the job with. Empty uses whatever is on PATH,
# which is the normal case once the environment is loaded.
ROOTSYS_OVERRIDE=""
